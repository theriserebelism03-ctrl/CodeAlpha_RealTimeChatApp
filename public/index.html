<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha Real-Time Chat</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Inter, Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      .app {
        display: flex;
        height: 100vh;
      }

      .sidebar {
        width: 260px;
        background: #1e1e2f;
        color: #f9fafb;
        padding: 20px 16px;
        border-right: 1px solid #2d3748;
      }

      .sidebar h2 {
        margin: 0 0 18px;
        font-size: 1.2rem;
      }

      .user-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .user-list li {
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .online-dot {
        display: inline-block;
        color: #22c55e;
        font-size: 0.9rem;
      }

      .chat-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #ffffff;
      }

      .chat-header {
        padding: 18px 20px;
        font-size: 1.2rem;
        font-weight: 600;
        background: #f8fafc;
        border-bottom: 1px solid #e5e7eb;
      }

      #messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #f8fafc;
      }

      .message-row {
        margin-bottom: 14px;
      }

      .message-bubble {
        display: inline-block;
        max-width: 70%;
        padding: 10px 12px;
        border-radius: 12px;
        background: #e5e7eb;
        word-wrap: break-word;
      }

      .message-meta {
        display: block;
        font-size: 0.72rem;
        color: #6b7280;
        margin-bottom: 6px;
      }

      .message-bubble.self {
        background: #dbeafe;
        float: right;
      }

      .system-alert {
        width: fit-content;
        max-width: 90%;
        margin: 18px auto;
        background: #fef3c7;
        color: #78350f;
        border-radius: 12px;
        padding: 10px 16px;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 500;
      }

      #chat-form {
        display: flex;
        gap: 10px;
        padding: 16px 20px;
        background: #f8fafc;
        border-top: 1px solid #e5e7eb;
      }

      #chat-form input {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        outline: none;
        font-size: 1rem;
      }

      #chat-form button {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Active Users</h2>
        <ul id="user-list" class="user-list"></ul>
      </aside>

      <main class="chat-panel">
        <div class="chat-header">CodeAlpha Real-Time Chat</div>
        <div id="messages"></div>

        <form id="chat-form">
          <input id="message-input" type="text" placeholder="Type your message..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const msgBox = document.getElementById('messages');
      const userList = document.getElementById('user-list');
      const form = document.getElementById('chat-form');
      const input = document.getElementById('message-input');

      let username = prompt('Enter display name:') || 'User_' + Math.floor(Math.random() * 1000);

      socket.emit('join', username);

      function appendMessage(payload) {
        const row = document.createElement('div');
        row.className = 'message-row';

        const meta = document.createElement('span');
        meta.className = 'message-meta';
        meta.textContent = `${payload.user} • ${payload.time}`;

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.textContent = payload.text;

        if (payload.user === username) {
          bubble.classList.add('self');
        }

        row.appendChild(meta);
        row.appendChild(bubble);
        msgBox.appendChild(row);
        msgBox.scrollTop = msgBox.scrollHeight;
      }

      function appendSystemAlert(payload) {
        const alert = document.createElement('div');
        alert.className = 'system-alert';
        alert.textContent = `${payload.text} • ${payload.time}`;
        msgBox.appendChild(alert);
        msgBox.scrollTop = msgBox.scrollHeight;
      }

      function renderUserList(users) {
        userList.innerHTML = '';

        users.forEach((user) => {
          const li = document.createElement('li');
          const dot = document.createElement('span');
          dot.className = 'online-dot';
          dot.textContent = '🟢';

          const name = document.createElement('span');
          name.textContent = user;

          li.appendChild(dot);
          li.appendChild(name);
          userList.appendChild(li);
        });
      }

      socket.on('chat-message', (payload) => {
        if (payload.user === 'System') {
          appendSystemAlert(payload);
        } else {
          appendMessage(payload);
        }
      });

      socket.on('user-list', (users) => {
        renderUserList(users);
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const text = input.value.trim();

        if (!text) {
          return;
        }

        socket.emit('send-message', text);
        input.value = '';
      });
    </script>
  </body>
</html>
